name: CD Pipeline

on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [ self-hosted, Linux, X64 ]
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - name: Check out tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0

    - name: Find compose files
      id: compose
      run: |
        for dir in stage-4/tempdir tempdir .; do
          if [ -f "$dir/docker-compose.yml" ]; then
            if [ ! -f "$dir/docker-compose.prod.yml" ]; then
              printf 'services:\n  web:\n    image: ${DOCKERHUB_USERNAME}/web:latest\n  scheduler:\n    image: ${DOCKERHUB_USERNAME}/scheduler:latest\n  worker:\n    image: ${DOCKERHUB_USERNAME}/worker:latest\n' > "$dir/docker-compose.prod.yml"
            fi
            if [ -f "$dir/docker-compose.prod.yml" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
        done

        echo "docker-compose.yml not found in stage-4/tempdir, tempdir, or repo root"
        find . -maxdepth 4 -name 'docker-compose*.yml'
        exit 1

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create .env
      working-directory: ${{ steps.compose.outputs.dir }}
      run: |
        {
          echo "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}"
          echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}"
          echo "RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}"
          echo "RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}"
          echo "DB_NAME=${{ secrets.DB_NAME }}"
          echo "COLLECTIONS_NAME=${{ secrets.COLLECTIONS_NAME }}"
          echo "MONGO_URI=${{ secrets.MONGO_URI }}"
          echo "PRODUCER_HOST=${{ secrets.PRODUCER_HOST }}"
          echo "RABBITMQ_ROUTER_EXCHANGE=${{ secrets.RABBITMQ_ROUTER_EXCHANGE }}"
          echo "RABBITMQ_ROUTER_QUEUE_JOBS=${{ secrets.RABBITMQ_ROUTER_QUEUE_JOBS }}"
          echo "RABBITMQ_ROUTER_ROUTING_KEY=${{ secrets.RABBITMQ_ROUTER_ROUTING_KEY }}"
        } > .env
        chmod 600 .env

    - name: Up (pull from Hub, no build on prod)
      working-directory: ${{ steps.compose.outputs.dir }}
      run: |
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --no-build --scale worker=3
        docker compose ps